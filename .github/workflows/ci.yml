name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the download small; requirements.txt then sees it as satisfied.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (everything that does not need the dataset or a local registry)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -m "not data and not registry" -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose --profile monitor build

      - name: Smoke test the stack (no model registered yet -> API must report degraded)
        run: |
          docker compose up -d mlflow api
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5000/health
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/health || true)
            [ "$code" = "503" ] && break
            sleep 2
          done
          cat /tmp/health.json
          test "$code" = "503"
          grep -q '"status":"degraded"' /tmp/health.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
